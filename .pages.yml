# Pages CMS (https://pagescms.org) — a free web editor for this repository.
# The artist signs in with GitHub and edits works, prices and status without code.
media:
  input: src/images/uploads
  output: /images/uploads

content:
  - name: works
    label: Works
    type: collection
    path: src/works
    filename: "{primary}.md"
    exclude: [works.11tydata.js]
    view:
      fields: [title, medium, status, price, year]
      primary: title
      sort: [date, title]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: medium, label: Medium, type: select, required: true, options: { values: [oil, pen] }, description: "oil = Oil Paint, pen = Pen Sketches" }
      - { name: materials, label: "Materials (shown as Medium)", type: string, description: "e.g. Oil on linen, Pen and ink on paper" }
      - { name: year, label: Year, type: number }
      - { name: height, label: "Height", type: number }
      - { name: width, label: "Width", type: number }
      - { name: depth, label: "Depth (0 for paper)", type: number }
      - { name: unit, label: Unit, type: select, options: { values: [cm, in] }, default: cm }
      - { name: price, label: "Price (no currency sign)", type: number }
      - { name: status, label: Status, type: select, required: true, options: { values: [Available, Reserved, Sold, Not for sale] }, description: "Checkout sets Reserved and Sold automatically. Set it here only when you sell or hold a work yourself." }
      - { name: date, label: "Date added (newest shows first)", type: date }
      - { name: featured, label: "Feature on the home page", type: boolean }
      - { name: relist, label: "Relist counter", type: number, default: 0, description: "Only if a sold work comes back (e.g. a refund): add 1 to clear the online Sold mark." }
      - { name: image, label: "Main photo", type: image, required: true }
      - { name: detail, label: "Close detail photo", type: image, required: true }
      - { name: edge, label: "Side edge photo", type: image, required: true }
      - { name: room, label: "In a room photo", type: image, required: true }
      - { name: body, label: "About this work", type: text }

  - name: prints
    label: Prints, cards and postcards
    type: collection
    path: src/prints-items
    filename: "{primary}.md"
    exclude: [prints-items.11tydata.js]
    view: { fields: [title, price], primary: title }
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: type, label: Type, type: select, required: true, options: { values: [print, card] }, description: "print = Prints, card = Cards & Postcards" }
      - { name: size, label: Print size, type: string }
      - { name: edition, label: "Edition, or Card / Postcard", type: string }
      - { name: price, label: Price, type: number }
      - { name: image, label: Photo, type: image }
      - { name: date, label: Date added, type: date }
      - { name: body, label: Description, type: text }

  - name: settings
    label: Settings
    type: file
    path: src/_data/site.json
    format: json
    fields:
      - { name: name, label: Site name, type: string }
      - { name: artistName, label: Artist name, type: string }
      - { name: tagline, label: "Home page tagline (8 words or fewer)", type: string }
      - { name: taglineOptions, label: "Tagline options (for reference)", type: string, list: true }
      - { name: intro, label: "Home page introduction (30–50 words)", type: text }
      - { name: introOptions, label: "Introduction options (for reference)", type: text, list: true }
      - { name: description, label: "Search engine description", type: text }
      - { name: email, label: Email, type: string }
      - { name: currency, label: "Currency (3-letter code, e.g. GBP, EUR, USD)", type: string }
      - { name: taxRule, label: "Tax / VAT line shown at checkout", type: string }
      - name: social
        label: Social links
        type: object
        list: true
        fields:
          - { name: label, type: string }
          - { name: url, type: string }
      - name: shipping
        label: Shipping
        type: object
        fields:
          - name: regions
            label: Regions
            type: object
            list: true
            fields:
              - { name: id, label: "Id (no spaces)", type: string }
              - { name: label, label: Name, type: string }
              - { name: cost, label: Cost, type: number }
              - { name: countries, label: "Country codes (* = everywhere else)", type: string, list: true }
      - name: prints
        label: Prints page
        type: object
        fields:
          - { name: enabled, label: Show the Prints page, type: boolean }
      - name: printClub
        label: Print Club (text shown on the site; the price charged is set in Stripe and PayPal)
        type: object
        fields:
          - { name: price, label: Monthly price, type: string }
          - { name: separatePrice, label: "Price of the 3 items bought one at a time", type: string }
          - { name: saving, label: Saving, type: string }
          - { name: printSize, label: Print size, type: string }
          - { name: shippingCost, label: Shipping cost, type: string }
          - { name: shippingCountriesText, label: Shipping countries (text), type: string }
          - { name: countries, label: "Shipping country codes (e.g. GB)", type: string, list: true }
          - { name: billingDateText, label: "Billing date (text, e.g. 1st)", type: string }
          - { name: billingDay, label: "Billing day of the month (1–28)", type: number }
          - name: gifts
            label: Gift plans
            type: object
            fields:
              - { name: enabled, label: Show gift plans, type: boolean }
              - { name: threeMonthPrice, label: 3-month gift price, type: string }
              - { name: twelveMonthPrice, label: 12-month gift price, type: string }
      - name: events
        label: Exhibitions, fairs and markets (the home page shows the next one; hidden when empty)
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: date, label: "Date (YYYY-MM-DD)", type: string }
          - { name: dateText, label: "Date as shown (e.g. 3–5 May 2027)", type: string }
          - { name: place, label: Place, type: string }
          - { name: url, label: Link (optional), type: string }
      - name: analytics
        label: Analytics
        type: object
        fields:
          - { name: cloudflareToken, label: Cloudflare Web Analytics token, type: string }
