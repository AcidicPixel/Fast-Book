<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Original Paintings</title>
  <meta name="description" content="Original paintings for sale." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" data-artist-name>Your Name</a>
    <nav>
      <a href="#gallery">Gallery</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1 data-artist-name>Your Name</h1>
      <p class="tagline" data-tagline></p>
    </section>

    <section id="gallery" class="gallery-section">
      <div class="gallery-head">
        <h2>Gallery</h2>
        <div class="filters" role="group" aria-label="Filter paintings">
          <button class="filter is-active" data-filter="all">All</button>
          <button class="filter" data-filter="available">Available</button>
          <button class="filter" data-filter="sold">Sold</button>
        </div>
      </div>
      <div id="grid" class="grid"></div>
      <p class="note" data-shipping-note></p>
    </section>

    <section id="about" class="about">
      <h2>About</h2>
      <div data-about></div>
    </section>

    <section id="contact" class="contact">
      <h2>Contact</h2>
      <p>Questions, commissions or shipping enquiries — I'd love to hear from you.</p>
      <p><a class="btn btn-outline" data-email-link href="#">Email me</a></p>
      <p class="socials" data-socials></p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span data-year></span> <span data-artist-name></span>. All artwork and images are the property of the artist.</p>
  </footer>

  <dialog id="detail" class="detail">
    <button class="close" aria-label="Close" data-close>&times;</button>
    <div class="detail-body">
      <img id="detail-img" alt="" />
      <div class="detail-info">
        <h3 id="detail-title"></h3>
        <p class="meta" id="detail-meta"></p>
        <p id="detail-desc"></p>
        <p class="price" id="detail-price"></p>
        <div id="detail-actions"></div>
      </div>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="paintings.js"></script>
  <script src="app.js"></script>
</body>
</html>
