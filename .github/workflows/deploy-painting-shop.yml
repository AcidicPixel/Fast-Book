# Publishes the painting-shop/ folder to GitHub Pages (free for public repos).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Deploy painting shop

on:
  push:
    branches: [main]
    paths:
      - "painting-shop/**"
      - ".github/workflows/deploy-painting-shop.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: painting-shop
      - id: deployment
        uses: actions/deploy-pages@v4
